<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu Casse-Briques Corrigé</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            color: #2ecc71;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .info-panel {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #gameCanvas {
            background-color: #111;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .controls-tip {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        #restartBtn {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #restartBtn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>Casse-Briques</h1>
    
    <div class="info-panel">
        <span>Score: <span id="scoreText">0</span></span>
        <span>Vies: <span id="livesText">3</span></span>
    </div>

    <canvas id="gameCanvas" width="480" height="320"></canvas>

    <button id="restartBtn">Rejouer</button>
    
    <div class="controls-tip">Contrôles : Flèches ⬅️ ➡️ ou Souris</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        const livesText = document.getElementById("livesText");
        const restartBtn = document.getElementById("restartBtn");

        // Configuration de la balle
        let ballRadius = 8;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 2;
        let dy = -2; // La balle part vers le haut

        // Configuration de la raquette
        let paddleHeight = 10;
        let paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let rightPressed = false;
        let leftPressed = false;

        // Configuration des briques
        let brickRowCount = 3;
        let brickColumnCount = 5;
        let brickWidth = 75;
        let brickHeight = 20;
        let brickPadding = 10;
        let brickOffsetTop = 30;
        let brickOffsetLeft = 30;

        const brickColors = ["#e74c3c", "#f39c12", "#3498db"];
        let bricks = [];

        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
                }
            }
        }

        let score = 0;
        let lives = 3;
        let gameActive = true;

        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);
        document.addEventListener("mousemove", mouseMoveHandler, false);
        restartBtn.addEventListener("click", resetGame);

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function mouseMoveHandler(e) {
            let relativeX = e.clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        }

        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += 10;
                            scoreText.textContent = score;
                            
                            if (score === brickRowCount * brickColumnCount * 10) {
                                gameActive = false;
                                setTimeout(() => {
                                    alert("🏆 BRAVO ! Vous avez gagné !");
                                    restartBtn.style.display = "block";
                                }, 50);
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#e74c3c";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
            ctx.fillStyle = "#2ecc71";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = bricks[c][r].color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function draw() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Rebond sur les murs gauche/droite
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            
            // Rebond sur le plafond
            if (y + dy < ballRadius) {
                dy = -dy;
            } 
            // Quand la balle arrive au niveau de la raquette
            else if (y + dy > canvas.height - ballRadius - 15) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    let hitPos = (x - paddleX) / paddleWidth;
                    dx = 5 * (hitPos - 0.5); // Modifie l'angle selon l'impact
                    dy = -dy;
                } 
                // Si la balle dépasse complètement la raquette et touche le fond
                else if (y + dy > canvas.height - ballRadius) {
                    lives--;
                    livesText.textContent = lives;
                    if (!lives) {
                        gameActive = false;
                        setTimeout(() => {
                            alert("💥 GAME OVER ! Vous n'avez plus de vies.");
                            restartBtn.style.display = "block";
                        }, 50);
                    } else {
                        // Reset de la balle au centre pour la vie suivante
                        x = canvas.width / 2;
                        y = canvas.height - 30;
                        dx = 2;
                        dy = -2;
                        paddleX = (canvas.width - paddleWidth) / 2;
                    }
                }
            }

            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 7;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 7;
            }

            x += dx;
            y += dy;

            requestAnimationFrame(draw);
        }

        function resetGame() {
            score = 0;
            lives = 3;
            scoreText.textContent = score;
            livesText.textContent = lives;
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = 2;
            dy = -2;
            paddleX = (canvas.width - paddleWidth) / 2;
            restartBtn.style.display = "none";
            gameActive = true;
            initBricks();
            draw();
        }

        initBricks();
        draw();
    </script>
</body>
</html>
